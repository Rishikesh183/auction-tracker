<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPL Squads Board</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f17;--card:#131a26;--line:#222c3d;--txt:#e8edf5;--mut:#8a97ab;--gold:#f5c542}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 10% -10%,#1b2540 0%,transparent 60%),var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;min-height:100vh}
header{padding:28px 20px 12px;max-width:1500px;margin:auto}
h1{font-family:'Bebas Neue';font-size:clamp(40px,6vw,64px);letter-spacing:2px;line-height:1}
h1 span{color:var(--gold)}
.sub{color:var(--mut);font-size:14px;margin-top:4px}
.bar{position:sticky;top:0;z-index:5;background:rgba(11,15,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.controls{max-width:1500px;margin:auto;padding:12px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1;min-width:200px;background:var(--card);border:1px solid var(--line);color:var(--txt);padding:10px 14px;border-radius:10px;font:inherit}
.chip{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:9px 14px;border-radius:999px;cursor:pointer;font:500 13px Inter}
.chip.on{background:var(--gold);color:#111;border-color:var(--gold)}
select{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:9px 12px;border-radius:10px;font:inherit}
.teams{display:flex;gap:6px;overflow-x:auto;max-width:1500px;margin:auto;padding:0 20px 12px;scrollbar-width:none}
.tchip{flex:none;padding:7px 12px;border-radius:8px;font:700 12px Inter;cursor:pointer;border:2px solid transparent;opacity:.55}
.tchip.on{opacity:1;border-color:#fff}
.stats{max-width:1500px;margin:16px auto 0;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:'Bebas Neue';font-size:28px;letter-spacing:1px;color:var(--gold)}
.stat small{color:var(--mut);font-size:12px}
main{max-width:1500px;margin:auto;padding:18px 20px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.head{padding:16px 16px 12px;position:relative}
.head h2{font-family:'Bebas Neue';font-size:30px;letter-spacing:1px;line-height:1}
.head .coach{font-size:12px;opacity:.85;margin-top:2px}
.head .abbr{position:absolute;right:12px;top:6px;font-family:'Bebas Neue';font-size:56px;opacity:.18;line-height:1}
.meta{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mut);flex-wrap:wrap}
.meta span b{color:var(--txt)}
.purse{height:4px;background:#0003}
.purse i{display:block;height:100%}
.sec{font:600 10px Inter;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);padding:10px 16px 4px}
ul{list-style:none;padding:0 8px 8px}
li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:13.5px}
li:hover{background:#ffffff08}
li .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
li .p{font-variant-numeric:tabular-nums;font-weight:600;min-width:52px;text-align:right}
li .p.big{color:var(--gold)}
li.os .n::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--tc);margin-right:7px;vertical-align:middle}
.tag{font:700 9.5px Inter;padding:2px 5px;border-radius:4px;background:#ffffff14;color:var(--mut);flex:none}
.tag.c{background:var(--gold);color:#111}
.tag.wk{background:#3b82f633;color:#93c5fd}
.tag.t{background:#a855f733;color:#d8b4fe}
.tag.r{background:#ef444433;color:#fca5a5}
.cty{font-size:10px;color:var(--mut);flex:none;width:28px;text-align:center}
.empty{color:var(--mut);padding:40px;text-align:center;grid-column:1/-1}
.legend{max-width:1500px;margin:10px auto 0;padding:0 20px;display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.legend span{display:flex;gap:6px;align-items:center}
</style>
</head>
<body>
<header>
  <h1>IPL <span>Squads</span> Board</h1>
  <div class="sub">All 10 franchises · head coaches · prices in ₹ crore</div>
</header>
<div class="bar">
  <div class="controls">
    <input type="search" id="q" placeholder="Search a player…">
    <button class="chip" id="os">Overseas only</button>
    <select id="sort">
      <option value="default">Order: squad list</option>
      <option value="price">Order: price ↓</option>
      <option value="name">Order: A–Z</option>
    </select>
  </div>
  <div class="teams" id="tchips"></div>
</div>
<div class="stats" id="stats"></div>
<div class="legend">
  <span><span class="tag c">C</span> Captain</span>
  <span><span class="tag wk">WK</span> Wicket-keeper</span>
  <span><span class="tag t">TRADE</span> Traded in</span>
  <span><span class="tag r">R</span> Marked (R) on sheet</span>
  <span>● coloured dot = overseas</span>
</div>
<main id="grid"></main>

TEAMS.forEach(t=>t.p=t.p.map((s,i)=>{const[n,p,c,f]=s.split("|");return{n,p:+p,c:c||"",f:f||"",core:i<12,i}}));
const S={q:"",os:false,sort:"default",team:null};
const $=id=>document.getElementById(id);
const fmt=v=>v<1?(v*100).toFixed(0)+"L":"₹"+v+" Cr";

function stats(){
  const all=TEAMS.flatMap(t=>t.p.map(p=>({...p,t})));
  const top=all.reduce((a,b)=>b.p>a.p?b:a);
  const rich=TEAMS.map(t=>({t,s:t.p.reduce((a,b)=>a+b.p,0)})).sort((a,b)=>b.s-a.s)[0];
  $("stats").innerHTML=[
    [all.length,"players across 10 squads"],
    [all.filter(p=>p.c).length,"overseas players"],
    [fmt(top.p),"top price · "+top.n+" ("+top.t.id+")"],
    ["₹"+rich.s.toFixed(1)+" Cr","biggest squad bill · "+rich.t.id]
  ].map(([b,s])=>`<div class="stat"><b>${b}</b><small>${s}</small></div>`).join("");
}
function chips(){
  $("tchips").innerHTML=`<div class="tchip ${!S.team?'on':''}" style="background:#2a3446;color:#fff" data-t="">ALL</div>`+
  TEAMS.map(t=>`<div class="tchip ${S.team===t.id?'on':''}" style="background:${t.bg};color:${t.fg}" data-t="${t.id}">${t.id}</div>`).join("");
}
function row(p,t){
  const tags=(p.f.includes("C")?'<span class="tag c">C</span>':'')+(p.f.includes("W")?'<span class="tag wk">WK</span>':'')+(p.f.includes("T")?'<span class="tag t">TRADE</span>':'')+(p.f.includes("R")?'<span class="tag r">R</span>':'');
  return `<li class="${p.c?'os':''}"><span class="n">${p.n}</span>${tags}<span class="cty">${p.c}</span><span class="p ${p.p>=10?'big':''}">${fmt(p.p)}</span></li>`;
}
function render(){
  const q=S.q.toLowerCase().trim();
  const max=Math.max(...TEAMS.map(t=>t.p.reduce((a,b)=>a+b.p,0)));
  let html="";
  TEAMS.filter(t=>!S.team||t.id===S.team).forEach(t=>{
    let ps=t.p.filter(p=>(!q||p.n.toLowerCase().includes(q))&&(!S.os||p.c));
    if(!ps.length)return;
    if(S.sort==="price")ps=[...ps].sort((a,b)=>b.p-a.p);
    if(S.sort==="name")ps=[...ps].sort((a,b)=>a.n.localeCompare(b.n));
    const total=t.p.reduce((a,b)=>a+b.p,0), os=t.p.filter(p=>p.c).length;
    const cap=t.p.find(p=>p.f.includes("C"));
    let body;
    if(S.sort==="default"&&!q&&!S.os){
      body=`<div class="sec">Core 12</div><ul>${ps.filter(p=>p.core).map(p=>row(p,t)).join("")}</ul>
            <div class="sec">Rest of squad</div><ul>${ps.filter(p=>!p.core).map(p=>row(p,t)).join("")}</ul>`;
    } else body=`<ul style="padding-top:8px">${ps.map(p=>row(p,t)).join("")}</ul>`;
    html+=`<section class="card" style="--tc:${t.bg==='#1b2133'?'#e5c07b':t.bg}">
      <div class="head" style="background:linear-gradient(135deg,${t.bg},${t.bg}cc);color:${t.fg}">
        <span class="abbr">${t.id}</span><h2>${t.name}</h2><div class="coach">Coach: ${t.coach} · Captain: ${cap?cap.n:'—'}</div>
      </div>
      <div class="purse"><i style="width:${total/max*100}%;background:${t.bg==='#1b2133'?'#e5c07b':t.bg}"></i></div>
      <div class="meta"><span><b>${t.p.length}</b> players</span><span><b>${os}</b> overseas</span><span><b>₹${total.toFixed(2)} Cr</b> total</span></div>
      ${body}</section>`;
  });
  $("grid").innerHTML=html||'<div class="empty">No players match.</div>';
  chips();
}
$("q").oninput=e=>{S.q=e.target.value;render()};
$("os").onclick=e=>{S.os=!S.os;e.target.classList.toggle("on",S.os);render()};
$("sort").onchange=e=>{S.sort=e.target.value;render()};
$("tchips").onclick=e=>{const d=e.target.closest(".tchip");if(!d)return;S.team=d.dataset.t||null;render()};
stats();render();
</script>
</body>
</html>
